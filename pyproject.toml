[build-system]
requires = [
    "setuptools>=75.0",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "repobrain"
version = "0.1.0"

description = "Agentic AI Repository Intelligence System"

readme = "README.md"

requires-python = ">=3.11"

authors = [
    { name = "Harsh Prabhakar" },
]

keywords = [
    "ai",
    "agentic-ai",
    "code-search",
    "repository-intelligence",
    "semantic-search",
    "static-analysis",
    "ast",
    "faiss",
    "embeddings",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]


dependencies = [
    # Core models / validation
    "pydantic>=2.8,<3.0",

    # Numerical computing
    "numpy>=2.0,<3.0",

    # Vector search
    "faiss-cpu>=1.15,<2.0",

    "openai>=3.10,<4.0",

    # Embedding stack
    #
    # Sentence Transformers 6.x requires Transformers 5.x.
    # RepoBrain currently uses Transformers 4.57.6 because
    # this stack has already been validated with CodeRankEmbed.
    "sentence-transformers==5.1.2",
    "transformers==4.57.6",
    "tokenizers>=0.22,<0.23",
    "einops>=0.8,<1.0",

    # PyTorch
    #
    # Do not pin a CUDA-specific build here.
    # Install the correct PyTorch build for the target machine.
    "torch>=2.4,<3.0",
]


[project.optional-dependencies]

dev = [
    "pytest>=8.0,<10.0",
]

test = [
    "pytest>=8.0,<10.0",
]


[tool.setuptools.packages.find]
include = [
    "repobrain*",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

python_functions = [
    "test_*",
]

addopts = [
    "-ra",
]


[tool.coverage.run]
branch = true

source = [
    "repobrain",
]


[tool.coverage.report]
show_missing = true
skip_covered = false

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]